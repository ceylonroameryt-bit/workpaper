# Render blueprint: a test deployment of Blynt Workpapers with its own Postgres.
# Render > New > Blueprint > pick this repo. Free plan: the app sleeps when idle,
# and the free database is deleted after 30 days.
services:
  - type: web
    name: blynt-workpapers
    runtime: node
    plan: free
    region: frankfurt
    branch: phase-a-completion
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blynt-db
          property: connectionString
      - key: MFA_REQUIRED
        value: "false"
      # Optional: Xero and QuickBooks. Render asks for these; leave blank to skip.
      # Redirect URIs are https://<your-app>.onrender.com/api/v1/integrations/{xero,quickbooks}/callback
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_REDIRECT_URI
        sync: false
      - key: QBO_CLIENT_ID
        sync: false
      - key: QBO_CLIENT_SECRET
        sync: false
      - key: QBO_REDIRECT_URI
        sync: false
      - key: QBO_ENV
        value: sandbox

databases:
  - name: blynt-db
    plan: free
    region: frankfurt
